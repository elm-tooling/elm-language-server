name: Test Diagnostics

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g elm
      - run: npm ci
      - run: npm run compile
      - run: node --loader ts-node/esm --expose-gc ./test/diagnostics.ts
